sensor:
  motion:
    - id: 0
      sensorName: "PIR-Front-1"
      sensitivity_range:
        minSensitivity: 1
        maxSensitivity: 10
      supportsDeepSleepAutonomy: true

      operational_modes:
        - MOTION
        - NO_MOTION

      defaultStartConfig:
        operationalMode: MOTION
        noMotionSeconds: 5
        activeStartSeconds: 0
        activeStopSeconds: 0

      active_windows:
        - startTimeOfDaySeconds: 32400
          endTimeOfDaySeconds: 61200
        - startTimeOfDaySeconds: 72000
          endTimeOfDaySeconds: 79200

      requirements:
        min_reaction_time_ms: 500
      notes:
        - "Front-facing PIR motion detector."
        - "Supports autonomous operation during deep sleep."
        - "Active windows can be configured via IMotionSensorController.setActiveWindows()."
